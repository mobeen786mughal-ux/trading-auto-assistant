name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Unzip Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          ls -R
      - name: Find Project + Create Fresh App
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "./.dart_tool/*" | head -1 | xargs dirname)
          echo "Old Project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          flutter create -t app fresh_app
          cp -r $PROJECT_DIR/lib/* fresh_app/lib/
          cp -r $PROJECT_DIR/assets fresh_app/assets/
          cp $PROJECT_DIR/pubspec.yaml fresh_app/pubspec.yaml
          ls -R fresh_app
      - name: Setup App Icon + Internet Permission
        run: |
          cd fresh_app
          for d in android/app/src/main/res/mipmap-*/; do cp assets/app_icon.png "$d/ic_launcher.png" || true; done
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' android/app/src/main/AndroidManifest.xml
          echo "Icon + Permission done"
      - name: Build APK
        run: |
          cd fresh_app
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-app-apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk

name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Unzip Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          ls -R
      - name: Create Fresh App + Copy Only Code
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "./.dart_tool/*" | head -1 | xargs dirname)
          flutter create -t app fresh_app
          rm -rf fresh_app/lib/*
          cp -r $PROJECT_DIR/lib/* fresh_app/lib/
          cp -r $PROJECT_DIR/assets fresh_app/assets/
          ls -R fresh_app
      - name: Fix pubspec
        run: |
          cd fresh_app
          grep -q "http:" pubspec.yaml || sed -i 's|flutter_lints.*|flutter_lints: ^3.0.0\n  http: ^1.1.0|' pubspec.yaml
          grep -q "assets/anime" pubspec.yaml || sed -i 's|# assets:|assets:\n    - assets/anime_girl.png\n    - assets/app_icon.png|' pubspec.yaml
          cat pubspec.yaml
      - name: Apna Icon Lagao - Pillow Install + Convert
        run: |
          pip install Pillow
          cd fresh_app
          python3 -c "from PIL import Image; im=Image.open('assets/app_icon.png').convert('RGB'); im.save('assets/app_icon.png')"
          python3 -c "from PIL import Image; im=Image.open('assets/anime_girl.png').convert('RGB'); im.save('assets/anime_girl.png')"
          file assets/app_icon.png
          for d in android/app/src/main/res/mipmap-*/; do cp assets/app_icon.png "$d/ic_launcher.png"; done
          echo "TERA ICON LAG GAYA BHAI"
      - name: Add Internet Permission
        run: |
          cd fresh_app
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd fresh_app
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-app-apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk

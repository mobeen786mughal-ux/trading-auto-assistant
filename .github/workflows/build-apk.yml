name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          ls -R

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Fresh Project and Copy Code
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "./.dart_tool/*" | head -1 | xargs dirname)
          echo "Old project: $PROJECT_DIR"
          flutter create -t app fresh_app
          cp -r $PROJECT_DIR/lib/* fresh_app/lib/
          cp -r $PROJECT_DIR/assets fresh_app/assets/ 2>/dev/null || true
          cp $PROJECT_DIR/pubspec.yaml fresh_app/pubspec.yaml
          ls -R fresh_app

      - name: Build APK
        run: |
          cd fresh_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-app-apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
